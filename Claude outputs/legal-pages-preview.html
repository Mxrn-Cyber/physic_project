  en: { onThisPage: "On this page", backToTop: "Back to top", alsoRead: "Also read", footer: { terms: "Terms", privacy: "Privacy", refund: "Refunds", legal: "Legal" }, nav: { home: "Home", videos: "Videos", books: "Books", about: "About" } },
  km: { onThisPage: "ក្នុងទំព័រនេះ", backToTop: "ត្រឡប់ទៅខាងលើ", alsoRead: "អានផងដែរ", footer: { terms: "លក្ខខណ្ឌប្រើប្រាស់", privacy: "ភាពឯកជន", refund: "ការសងប្រាក់វិញ", legal: "ផ្លូវច្បាប់" }, nav: { home: "ទំព័រដើម", videos: "វីដេអូ", books: "សៀវភៅ", about: "អំពីយើង" } }
};

const ICONS = {
  terms: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>',
  privacy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>',
  refund: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>'
};

let doc = "terms";
let lang = "en";
let dark = false;
let activeIndex = 0;

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function render(){
  const pack = legal[lang];
  const c = pack[doc];
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('data-lang', lang);

  // nav labels
  document.getElementById('navHome') && 0;
  document.querySelector('[data-t="navHome"]').textContent = t.nav.home;
  document.querySelector('[data-t="navVideos"]').textContent = t.nav.videos;
  document.querySelector('[data-t="navBooks"]').textContent = t.nav.books;
  document.querySelector('[data-t="navAbout"]').textContent = t.nav.about;
  document.getElementById('langLabel').textContent = lang === 'en' ? 'KH' : 'ENG';

  // switcher
  const switcher = document.getElementById('switcher');
  switcher.innerHTML = '';
  ['terms','privacy','refund'].forEach((key) => {
    const active = key === doc;
    const p = el(`<button class="pill ${active?'active':''}" type="button">${ICONS[key]}${t.footer[key]}</button>`);
    p.addEventListener('click', () => { doc = key; activeIndex = 0; render(); });
    switcher.appendChild(p);
  });

  // header
  document.getElementById('docIcon').innerHTML = ICONS[doc];
  document.getElementById('docTitle').textContent = c.title;
  document.getElementById('updatedPill').textContent = `${pack.lastUpdatedLabel}: ${LAST_UPDATED}`;
  document.getElementById('docIntro').textContent = c.intro;
  document.getElementById('onThisPageLabel').textContent = t.onThisPage;
  document.getElementById('backTopLabel').textContent = t.backToTop;

  // chips (mobile toc)
  const chipRow = document.getElementById('chipRow');
  chipRow.innerHTML = '';
  c.sections.forEach((s, i) => {
    const chip = el(`<button class="chip ${i===activeIndex?'active':''}" type="button">${s.heading}</button>`);
    chip.addEventListener('click', () => scrollToSection(i));
    chipRow.appendChild(chip);
  });

  // desktop toc
  const tocList = document.getElementById('tocList');
  tocList.innerHTML = '';
  c.sections.forEach((s, i) => {
    const li = document.createElement('li');
    const btn = el(`<button class="toc-item ${i===activeIndex?'active':''}" type="button">${s.heading}</button>`);
    btn.addEventListener('click', () => scrollToSection(i));
    li.appendChild(btn);
    tocList.appendChild(li);
  });

  // sections
  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';
  observedSections = [];
  c.sections.forEach((s, i) => {
    const sec = el(`<section class="section fade-in" id="section-${i}" style="scroll-margin-top:112px;">
      <h2><span class="num">${String(i+1).padStart(2,'0')}</span>${s.heading}</h2>
      <p>${s.body}</p>
    </section>`);
    sectionsEl.appendChild(sec);
    observedSections.push(sec);
  });

  // also read footer
  const alsoRead = document.getElementById('alsoRead');
  const others = ['terms','privacy','refund'].filter(k => k !== doc);
  alsoRead.innerHTML = t.alsoRead + ': ';
  others.forEach((key, i) => {
    const link = el(`<a href="#">${t.footer[key]}</a>`);
    link.addEventListener('click', (e) => { e.preventDefault(); doc = key; activeIndex = 0; render(); window.scrollTo({top:0, behavior:'smooth'}); });
    alsoRead.appendChild(link);
    if (i < others.length - 1) alsoRead.appendChild(document.createTextNode(' · '));
  });

  setupObserver();
}

let observedSections = [];
let io = null;
function setupObserver(){
  if (io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    const visible = entries.filter(e => e.isIntersecting);
    if (!visible.length) return;
    const top = visible.reduce((a,b) => a.boundingClientRect.top < b.boundingClientRect.top ? a : b);
    const idx = observedSections.indexOf(top.target);
    if (idx !== -1 && idx !== activeIndex) {
      activeIndex = idx;
      document.querySelectorAll('.toc-item').forEach((n,i) => n.classList.toggle('active', i===idx));
      document.querySelectorAll('.chip').forEach((n,i) => n.classList.toggle('active', i===idx));
    }
  }, { rootMargin: '-112px 0px -70% 0px', threshold: 0 });
  observedSections.forEach(s => io.observe(s));
}

function scrollToSection(i){
  const target = document.getElementById(`section-${i}`);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'en' ? 'km' : 'en';
  render();
});
document.getElementById('darkBtn').addEventListener('click', () => {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('darkBtn').textContent = dark ? '☀' : '🌙';
});
window.addEventListener('scroll', () => {
  document.getElementById('backTop').classList.toggle('show', window.scrollY > 480);
});
document.getElementById('backTop').addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

render();
</script>
</body>
</html>
