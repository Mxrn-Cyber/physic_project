name: Server tests

# Runs the unlock-logic and ABA-signature tests on every push and PR, so a
# change that breaks who-gets-paid-content or which payment callbacks are
# trusted fails a check on GitHub instead of surfacing on the live site.
on:
  push:
    branches: ["**"]
    paths:
      - "tutorial-site/server/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "tutorial-site/server/**"
      - ".github/workflows/server-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorial-site/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tutorial-site/server/package-lock.json

      - run: npm ci

      - run: npm test
