<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Title -->
    <title>E-TnakRean | Learn Anytime, Anywhere</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple Devices -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Description -->
    <meta
      name="description"
      content="E-TnakRean is an online learning platform offering high-quality courses, expert instructors, and flexible learning."
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#4F46E5" />

    <!-- Bilingual type: Poppins for Latin text, Kantumruy Pro for Khmer --
         a modern rounded-geometric pairing common on Cambodian tech sites. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Identity Services -- powers the "Sign in with Google" button
         on the Login/Register pages. Safe to load even before a Google
         OAuth Client ID is configured (see VITE_GOOGLE_CLIENT_ID). -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
