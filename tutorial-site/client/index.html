<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>eTnakRean | Learn Anytime, Anywhere</title>

    <!-- Second proof of ownership for Google Search Console, alongside
         public/googleb35d0b958d506ec4.html. Either one alone is enough;
         keeping both means losing one doesn't un-verify the property.
         Do not remove without checking Search Console first. -->
    <meta
      name="google-site-verification"
      content="xf6qS4JeI1nZEEeoKfmFHeW0XzTwevWGGpaMsu34OyQ"
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Installable app: manifest + iOS's own (non-standard) equivalents,
         since Safari on iOS still doesn't read the manifest for these bits. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="eTnakRean" />

    <meta
      name="description"
      content="E-TnakRean is an online learning platform offering high-quality courses, expert instructors, and flexible learning."
    />

    <meta name="theme-color" content="#dc2626" />

    <!-- Open Graph / Twitter: what Facebook, Telegram and Messenger show when
         someone shares a link to this site. Without these, a shared link
         renders as a bare URL with no title, description or picture -- which
         matters a lot when those apps are the main way people find you.

         The domain below is rewritten at build time from VITE_SITE_URL
         (see vite-plugin-seo.js), so it is defined in one place only.
         og:url and og:image must be ABSOLUTE URLs -- relative paths are
         ignored by every scraper. /og-image.png is the
         1200x630 banner those scrapers crop to. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E-TnakRean" />
    <meta property="og:title" content="E-TnakRean | Learn Anytime, Anywhere" />
    <meta
      property="og:description"
      content="Short, practical video tutorials paired with printable PDF guides, in Khmer and English. Buy only what you want to learn."
    />
    <meta property="og:url" content="https://REPLACE-WITH-YOUR-DOMAIN" />
    <meta property="og:image" content="https://REPLACE-WITH-YOUR-DOMAIN/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="km_KH" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="E-TnakRean | Learn Anytime, Anywhere" />
    <meta
      name="twitter:description"
      content="Short, practical video tutorials paired with printable PDF guides, in Khmer and English."
    />
    <meta name="twitter:image" content="https://REPLACE-WITH-YOUR-DOMAIN/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
